<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard de Faturamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: moldura escura estilo dashboard Excel — coluna esquerda (segmentações + gráficos), coluna direita (KPIs + mapa) */
:root{
  --bg:#121110; --frame:#1b1a19; --panel:#242220; --panel-2:#2c2926; --line:#3a3530;
  --accent:#f07a2a; --accent-hi:#ffa25a; --accent-lo:#a9481a; --accent-soft:rgba(240,122,42,.16);
  --text:#f4efea; --muted:#a69d95; --dim:#6b645e;
  --map-base:#5f8a4e; --map-hi:#8fbf72; --map-sel:#ef8a6f;
  --ok:#6fbf73; --bad:#e8604c;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--text);font-family:var(--body)}
body{padding-inline:16px;padding-block:16px}
.frame{max-width:1500px;margin:0 auto;background:var(--frame);border:1px solid var(--line);border-radius:14px;padding:18px 20px 22px;display:flex;flex-direction:column;gap:16px}

/* Header */
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-family:var(--body);font-weight:600;font-size:clamp(26px,3.4vw,44px);margin:0;letter-spacing:-.01em;line-height:1.05;text-wrap:balance}
.meta{color:var(--muted);font-size:13px;margin-top:4px}
.meta b{color:var(--text);font-weight:600}
.head-txt{flex:1 1 320px;min-width:0}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{font:600 14px var(--body);border:1px solid var(--accent);background:var(--accent);color:#1a0d04;border-radius:8px;padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--accent-hi)}
.btn.ghost{background:transparent;color:var(--accent-hi)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn:focus-visible,.chip:focus-visible,.slicer button:focus-visible,path.uf:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px}
.logo{width:120px;height:56px;border:1.5px solid var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--accent);font:700 14px/1.1 var(--display);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.rule{height:2px;background:linear-gradient(90deg,var(--accent),var(--accent-lo) 70%,transparent)}

/* Grid */
.main{display:grid;grid-template-columns:minmax(0,2.35fr) minmax(300px,1fr);gap:16px}
.left,.right{display:flex;flex-direction:column;gap:16px;min-width:0}
.slicers{display:grid;grid-template-columns:.8fr 1fr 1.6fr 1fr;gap:10px}
.slicer{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px 10px;min-width:0}
.slicer h3{margin:0 0 6px;font:600 13px var(--body);display:flex;justify-content:space-between;align-items:center;color:var(--text)}
.slicer h3 button{background:none;border:0;color:var(--muted);cursor:pointer;font:500 12px var(--body);padding:0}
.slicer h3 button:hover{color:var(--accent-hi)}
.slicer .opts{display:flex;flex-wrap:wrap;gap:5px}
.slicer .opts button{font:500 12px var(--body);background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:4px 8px;cursor:pointer}
.slicer .opts button:hover{border-color:var(--accent)}
.slicer .opts button.on{background:var(--accent);border-color:var(--accent);color:#1a0d04;font-weight:600}
.slicer .opts button.na{opacity:.35}

.row{display:grid;gap:16px}
.row.r1{grid-template-columns:1.15fr 1fr 1fr}
.row.r2{grid-template-columns:1.9fr 1fr}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:30px 12px 10px;position:relative;margin-top:12px;min-width:0}
.panel>.ttl{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,var(--accent-hi),var(--accent));color:#1a0d04;font:700 14px var(--body);padding:5px 16px;border-radius:5px;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.panel .hint{position:absolute;top:8px;right:12px;font-size:11px;color:var(--dim)}
.cv{position:relative;height:250px}
.r2 .cv{height:240px}

/* KPIs */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
.kpi .k{background:linear-gradient(180deg,var(--accent-hi),var(--accent));color:#1a0d04;font:700 13.5px/1.2 var(--body);text-align:center;padding:9px 8px;min-height:44px;display:flex;align-items:center;justify-content:center}
.kpi .v{font:700 clamp(18px,1.7vw,24px) var(--body);text-align:center;padding:10px 6px 2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--muted);text-align:center;padding:0 6px 10px;min-height:16px}
.kpi .s .bad{color:var(--bad);font-weight:600}.kpi .s .ok{color:var(--ok);font-weight:600}

.mapwrap{position:relative}
.mapwrap svg{width:100%;height:auto;max-height:440px;display:block}
path.uf{stroke:var(--frame);stroke-width:1;cursor:pointer;transition:fill .2s}
path.uf:hover{stroke:var(--text);stroke-width:1.4}
.legend{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend .bar{flex:1;min-width:90px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--map-base),var(--map-hi))}
.legend .sel{display:inline-flex;gap:5px;align-items:center}.legend .sel i{width:10px;height:10px;border-radius:2px;background:var(--map-sel)}
.sel-total{margin-top:8px;border-top:1px solid var(--line);padding-top:8px;display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.sel-total b{color:var(--text);font-variant-numeric:tabular-nums}
.tip{position:fixed;pointer-events:none;background:#0d0c0b;border:1px solid var(--accent);color:var(--text);padding:6px 9px;border-radius:6px;font-size:12px;z-index:20;white-space:nowrap}

.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:28px;font-size:12px;color:var(--muted)}
.chip{background:var(--accent-soft);border:1px solid var(--accent-lo);color:var(--accent-hi);border-radius:20px;padding:4px 10px;font:600 12px var(--body);cursor:pointer}
.chip:hover{border-color:var(--accent)}

.empty{border:2px dashed var(--accent-lo);border-radius:12px;padding:48px 20px;text-align:center;color:var(--muted)}
.empty h2{color:var(--text);font-family:var(--display);font-size:26px;margin:0 0 8px}
.empty code{color:var(--accent-hi)}
.err{background:rgba(232,96,76,.12);border:1px solid var(--bad);color:var(--text);border-radius:8px;padding:10px 14px;font-size:13px}
.drop{position:fixed;inset:0;background:rgba(18,17,16,.88);display:flex;align-items:center;justify-content:center;z-index:30;border:3px dashed var(--accent);font:700 28px var(--display);color:var(--accent-hi)}
.loading{color:var(--muted);font-size:14px;padding:30px;text-align:center}
footer{color:var(--dim);font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

@media (max-width:1180px){.main{grid-template-columns:1fr}.right{display:grid;grid-template-columns:1fr 1fr;gap:16px}.right .panel{margin-top:0}}
@media (max-width:900px){.row.r1{grid-template-columns:1fr 1fr}.row.r1 .panel:first-child{grid-column:1/-1}.row.r2{grid-template-columns:1fr}.slicers{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.row.r1{grid-template-columns:1fr}.right{grid-template-columns:1fr}.slicers{grid-template-columns:1fr}.frame{padding:14px 12px}.logo{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="frame">
  <header>
    <div class="head-txt">
      <h1>Dashboard de Faturamento</h1>
      <div class="meta" id="meta">Carregando dados…</div>
    </div>
    <div class="actions">
      <button class="btn" id="btnUp" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>
        Carregar planilha
      </button>
      <input type="file" id="file" accept=".csv,.txt,.xlsx,.xls" hidden>
    </div>
  </header>
  <div class="rule"></div>
  <div id="msg"></div>
  <div id="app"><div class="loading">Carregando dados…</div></div>
  <footer><span>Aceita CSV (separador ; ou ,) e XLSX exportados do sistema. Arraste o arquivo para a página ou use “Carregar planilha”.</span><span id="foot"></span></footer>
</div>
<div class="tip" id="tip" hidden></div>
<div class="drop" id="drop" hidden>Solte o arquivo para atualizar o dashboard</div>

<template id="tpl">
  <div class="main">
    <div class="left">
      <div class="slicers">
        <div class="slicer" data-key="ano"><h3>Ano de vencimento <button type="button" data-clear="ano">limpar</button></h3><div class="opts"></div></div>
        <div class="slicer" data-key="regiao"><h3>Região <button type="button" data-clear="regiao">limpar</button></h3><div class="opts"></div></div>
        <div class="slicer" data-key="situacao"><h3>Situação da cobrança <button type="button" data-clear="situacao">limpar</button></h3><div class="opts"></div></div>
        <div class="slicer" data-key="cliente"><h3>Cliente <button type="button" data-clear="cliente">limpar</button></h3><div class="opts"></div></div>
      </div>
      <div class="chips" id="chips"></div>
      <div class="row r1">
        <div class="panel"><div class="ttl">Faturamento por situação</div><div class="cv"><canvas id="cSit"></canvas></div></div>
        <div class="panel"><div class="ttl">Por tipo de cobrança</div><div class="cv"><canvas id="cTipo"></canvas></div></div>
        <div class="panel"><div class="ttl">Crescimento anual</div><div class="cv"><canvas id="cAno"></canvas></div></div>
      </div>
      <div class="row r2">
        <div class="panel"><div class="ttl">Evolução mensal de faturamento</div><div class="cv"><canvas id="cMes"></canvas></div></div>
        <div class="panel"><div class="ttl">Forma de pagamento (pagas)</div><div class="cv"><canvas id="cMeio"></canvas></div></div>
      </div>
    </div>
    <div class="right">
      <div class="kpis" id="kpis"></div>
      <div class="panel"><div class="ttl">Faturamento por UF</div>
        <div class="mapwrap"><svg id="map" viewBox="0 0 613 639" role="img" aria-label="Mapa do Brasil com faturamento por UF"></svg></div>
        <div class="legend"><span>menor</span><span class="bar"></span><span>maior</span><span class="sel"><i></i>selecionado</span></div>
        <div class="sel-total"><span id="selLbl">Clique em um estado para filtrar</span><b id="selVal"></b></div>
      </div>
    </div>
  </div>
</template>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

const DEFAULT_FILE = 'dados.csv';
const REGIOES = {Norte:['AC','AP','AM','PA','RO','RR','TO'],Nordeste:['AL','BA','CE','MA','PB','PE','PI','RN','SE'],'Centro-Oeste':['DF','GO','MT','MS'],Sudeste:['ES','MG','RJ','SP'],Sul:['PR','RS','SC']};
const UF2REG = {}; Object.entries(REGIOES).forEach(([r,l])=>l.forEach(u=>UF2REG[u]=r));
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MEIOS = {BOL:'Boleto',PIX:'PIX',CRE:'Cartão de crédito',DEB:'Cartão de débito'};
const SIT_ORDER = ['Paga','A Vencer','Aberta','Em Processamento','Vencida','Suspensa','Cancelada','Em cancelamento','Estornada'];

/* ---------- Mapeamento de colunas (tolerante a acento/maiúsculas) ---------- */
const COLS = {
  uf:['ufprincipal','uf','estado'], cliente:['cliente'], tipo:['tipodecobranca','tipocobranca','tipo'],
  situacao:['situacaocobranca','situacaodacobranca','situacao','status'],
  venc:['datavencimento','datadevencimento','vencimento'], pag:['datadepagamento','datapagamento','pagamento'],
  valor:['valor','valorcobranca','valortotal'], desconto:['valordesconto','desconto'],
  prazo:['prazoderecebimento','prazorecebimento'], meio:['meiodepagamento','meiopagamento','formadepagamento'],
  acesso:['acessoaplataforma','acesso']
};
const REQUIRED = {valor:'Valor', venc:'Data Vencimento', situacao:'Situação Cobranca'};
const norm = s => String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');

function parseNum(v){
  if(v==null||v==='') return null;
  if(typeof v==='number') return isFinite(v)?v:null;
  let s=String(v).replace(/R\$|\s/g,'');
  if(!s) return null;
  const c=s.lastIndexOf(','), d=s.lastIndexOf('.');
  if(c>-1&&d>-1) s = c>d ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  else if(c>-1) s=s.replace(/\./g,'').replace(',','.');
  const n=parseFloat(s); return isFinite(n)?n:null;
}
function parseDate(v){
  if(v==null||v==='') return null;
  if(v instanceof Date) return isNaN(v)?null:{y:v.getFullYear(),m:v.getMonth()};
  if(typeof v==='number'){ if(v<20000) return null; const d=new Date(Math.round((v-25569)*864e5)); return {y:d.getUTCFullYear(),m:d.getUTCMonth()}; }
  const s=String(v).trim();
  let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){ let y=+m[3]; if(y<100) y+=2000; return {y, m:+m[2]-1}; }
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return {y:+m[1], m:+m[2]-1};
  if(/^\d+([.,]\d+)?$/.test(s)) return parseDate(parseNum(s));
  return null;
}
function meioLabel(v){
  const s=String(v??'').trim().toUpperCase(); if(!s) return null;
  if(s.includes(',')||s.includes('/')) return 'Misto';
  return MEIOS[s]||s;
}

function buildRows(objs){
  if(!objs.length) throw new Error('O arquivo não tem linhas de dados.');
  const headers=Object.keys(objs[0]); const map={};
  for(const [k,alts] of Object.entries(COLS)){
    const h=headers.find(h=>alts.includes(norm(h)))||headers.find(h=>alts.some(a=>norm(h).startsWith(a)&&a.length>4));
    if(h) map[k]=h;
  }
  const miss=Object.keys(REQUIRED).filter(k=>!map[k]);
  if(miss.length) throw new Error('Não encontrei as colunas: '+miss.map(k=>'“'+REQUIRED[k]+'”').join(', ')+'. Colunas lidas: '+headers.join(' | '));
  const rows=[]; let skipped=0;
  for(const o of objs){
    const valor=parseNum(o[map.valor]); const venc=parseDate(o[map.venc]);
    if(valor==null||!venc){skipped++;continue;}
    const uf=String(o[map.uf]??'').trim().toUpperCase();
    rows.push({
      valor, y:venc.y, m:venc.m, uf, regiao:UF2REG[uf]||'Outros',
      cliente:String(o[map.cliente]??'').trim()||'—',
      tipo:String(o[map.tipo]??'').trim()||'Não informado',
      situacao:String(o[map.situacao]??'').trim()||'Não informada',
      desconto:parseNum(o[map.desconto])||0,
      prazo:parseNum(o[map.prazo]),
      meio:meioLabel(o[map.meio]),
      acesso:String(o[map.acesso]??'').trim()
    });
  }
  return {rows, skipped, cols:map};
}

/* ---------- Leitura de arquivos ---------- */
function decode(buf){
  try{ return new TextDecoder('utf-8',{fatal:true}).decode(buf); }
  catch(e){ return new TextDecoder('windows-1252').decode(buf); }
}
function parseCSVText(txt){
  const r=Papa.parse(txt.replace(/^﻿/,''),{header:true,skipEmptyLines:'greedy',delimitersToGuess:[';',',','\t','|']});
  return r.data;
}
function parseBuffer(buf,name){
  if(/\.xlsx?$/i.test(name)){
    const wb=XLSX.read(buf,{type:'array',cellDates:true});
    const ws=wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(ws,{defval:'',raw:true});
  }
  return parseCSVText(decode(buf));
}
async function loadFile(file){
  showMsg(''); setMeta('Lendo <b>'+esc(file.name)+'</b>…');
  try{
    const buf=await file.arrayBuffer();
    ingest(parseBuffer(buf,file.name), file.name);
  }catch(e){ showMsg(e.message); setMeta(DATA?metaTxt():'Nenhum dado carregado.'); }
}
async function loadDefault(){
  try{
    const r=await fetch(DEFAULT_FILE,{cache:'no-store'});
    if(!r.ok) throw 0;
    const buf=await r.arrayBuffer();
    ingest(parseBuffer(buf,DEFAULT_FILE), DEFAULT_FILE);
  }catch(e){
    if(e&&e.message) showMsg(e.message);
    setMeta('Nenhum dado carregado.');
    document.getElementById('app').innerHTML='<div class="empty"><h2>Carregue a planilha de cobranças</h2><p>Use o botão <b>Carregar planilha</b> ou arraste um arquivo <code>.csv</code> / <code>.xlsx</code> para esta página.<br>Para abrir já com dados, coloque um <code>'+DEFAULT_FILE+'</code> na mesma pasta do <code>index.html</code>.</p></div>';
  }
}

function ingest(objs,name){
  const res=buildRows(objs);
  if(!res.rows.length) throw new Error('Nenhuma linha válida (verifique as colunas Valor e Data Vencimento).');
  DATA=res; SRC=name; Object.values(F).forEach(s=>s.clear());
  setMeta(metaTxt());
  if(res.skipped) showMsg(res.skipped.toLocaleString('pt-BR')+' linha(s) ignorada(s) por não terem valor ou data de vencimento válidos.', true);
  mount(); render();
}
function metaTxt(){
  const ys=[...new Set(DATA.rows.map(r=>r.y))].sort();
  return 'Fonte: <b>'+esc(SRC)+'</b> · '+DATA.rows.length.toLocaleString('pt-BR')+' cobranças · vencimentos de '+ys[0]+' a '+ys[ys.length-1];
}

  svg.addEventListener('mouseleave',()=>tip.hidden=true);
  svg.querySelectorAll('title').forEach(t=>t.remove());
  svg.addEventListener('click',e=>{const p=e.target.closest('path.uf'); if(p) toggle('uf',p.dataset.uf);});
  svg.addEventListener('keydown',e=>{const p=e.target.closest('path.uf'); if(p&&(e.key==='Enter'||e.key===' ')){e.preventDefault();toggle('uf',p.dataset.uf);}});
  document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{F[b.dataset.clear].clear();render();});
  buildCharts();
}
function toggle(k,v){ F[k].has(v)?F[k].delete(v):F[k].add(v); render(); }

function buildCharts(){
  Chart.register(ChartDataLabels);
  const T=css('--text'), M=css('--muted'), L=css('--line'), A=css('--accent'), AH=css('--accent-hi'), AL=css('--accent-lo');
  Chart.defaults.color=M; Chart.defaults.font.family=css('--body'); Chart.defaults.font.size=12;
  Chart.defaults.plugins.legend.display=false; Chart.defaults.maintainAspectRatio=false;
  Chart.defaults.plugins.tooltip.backgroundColor='#0d0c0b'; Chart.defaults.plugins.tooltip.borderColor=A; Chart.defaults.plugins.tooltip.borderWidth=1;
  const grad=(ctx,horiz)=>{const {chart}=ctx; const a=chart.chartArea; if(!a) return A;
    const g=horiz?chart.ctx.createLinearGradient(a.left,0,a.right,0):chart.ctx.createLinearGradient(0,a.bottom,0,a.top);
    g.addColorStop(0,AL); g.addColorStop(1,AH); return g;};
  const money={callbacks:{label:c=>' '+brl.format(c.parsed.y??c.parsed)}};
  const click=(key,labelsFn)=>(e,els)=>{ if(els.length) toggle(key,labelsFn(els[0].index)); };

  CH.sit=new Chart(cSit,{type:'bar',data:{labels:[],datasets:[{data:[],backgroundColor:c=>grad(c,true),borderRadius:3,barPercentage:.75}]},
    options:{indexAxis:'y',layout:{padding:{right:62}},onClick:click('situacao',i=>CH.sit.data.labels[i]),
      scales:{x:{display:false,grid:{display:false}},y:{grid:{display:false},border:{display:false},ticks:{color:T,font:{weight:600}}}},
      plugins:{tooltip:{callbacks:{label:c=>' '+brl.format(c.parsed.x)}},datalabels:{anchor:'end',align:'end',color:T,font:{size:11,weight:600},formatter:cmp,clip:false}}}});

  CH.tipo=new Chart(cTipo,{type:'bar',data:{labels:[],datasets:[{data:[],backgroundColor:c=>grad(c,false),borderRadius:3,barPercentage:.55}]},
    options:{layout:{padding:{top:24}},onClick:click('tipo',i=>CH.tipo.data.labels[i]),
      scales:{y:{display:false,beginAtZero:true},x:{grid:{display:false},border:{color:L},ticks:{color:T,font:{weight:600},maxRotation:0,callback:function(v){const l=this.getLabelForValue(v);return l.length>14?l.split(' '):l;}}}},
      plugins:{tooltip:money,datalabels:{anchor:'end',align:'end',color:T,font:{size:11,weight:600},formatter:cmp}}}});

  CH.ano=new Chart(cAno,{data:{labels:[],datasets:[
      {type:'line',data:[],borderColor:AH,borderDash:[4,4],borderWidth:2,pointRadius:3,pointBackgroundColor:AH,datalabels:{display:false},tension:0},
      {type:'bar',data:[],backgroundColor:c=>grad(c,false),borderRadius:3,barPercentage:.6}]},
    options:{layout:{padding:{top:34}},onClick:(e,els)=>{ if(els.length) toggle('ano',+CH.ano.data.labels[els[0].index]); },
      scales:{y:{display:false,beginAtZero:true},x:{grid:{display:false},border:{color:L},ticks:{color:T,font:{weight:700}}}},
      plugins:{tooltip:{filter:i=>i.datasetIndex===1,callbacks:{label:c=>' '+brl.format(c.parsed.y)}},
        datalabels:{anchor:'end',align:'end',color:T,font:{size:11,weight:600},textAlign:'center',
          formatter:(v,c)=>{const d=c.dataset.data; const i=c.dataIndex; if(i===0||!d[i-1]) return cmp(v); const g=v/d[i-1]-1; return [cmp(v),(g>=0?'▲ ':'▼ ')+pct(Math.abs(g))];},
          color:c=>{const d=c.dataset.data,i=c.dataIndex; return T;}}}}});

  CH.mes=new Chart(cMes,{type:'line',data:{labels:MESES,datasets:[]},
    options:{layout:{padding:{top:20,right:22,left:22}},interaction:{mode:'index',intersect:false},
      scales:{y:{display:false,beginAtZero:true,grace:'12%'},x:{grid:{display:false},border:{color:L},ticks:{color:T}}},
      plugins:{legend:{display:true,position:'bottom',labels:{color:T,boxWidth:18,boxHeight:3,usePointStyle:false}},
        tooltip:{callbacks:{label:c=>' '+c.dataset.label+': '+brl.format(c.parsed.y)}},
        datalabels:{display:'auto',align:'top',offset:4,color:c=>c.dataset.borderColor,font:{size:10,weight:600},formatter:v=>v?cmp(v):''}}}});

  CH.meio=new Chart(cMeio,{type:'doughnut',data:{labels:[],datasets:[{data:[],backgroundColor:[AH,A,AL,'#7a3412','#f6c9a3','#5c2a10'],borderColor:css('--panel'),borderWidth:2}]},
    options:{cutout:'52%',layout:{padding:8},onClick:click('meio',i=>CH.meio.data.labels[i]),
      plugins:{legend:{display:true,position:'right',labels:{color:T,boxWidth:12,padding:10}},
        tooltip:{callbacks:{label:c=>' '+c.label+': '+brl.format(c.parsed)}},
        datalabels:{color:'#1a0d04',font:{weight:700,size:12},formatter:(v,c)=>{const t=c.dataset.data.reduce((a,b)=>a+b,0); const p=v/t; return p<.04?'':pct(p).replace(/,\d%/,'%');}}}}});
}

/* ---------- Render ---------- */
let UFV={}, UFN={};
const sum=(rs,f=r=>r.valor)=>rs.reduce((a,r)=>a+f(r),0);
function groupSum(rs,key){const m=new Map(); for(const r of rs){const k=r[key]; if(k==null) continue; m.set(k,(m.get(k)||0)+r.valor);} return m;}

function render(){
  if(!DATA) return;
  const all=DATA.rows, rs=all.filter(r=>pass(r));
  renderSlicers(all); renderChips();

  // KPIs
  const tot=sum(rs), n=rs.length;
  const paga=rs.filter(r=>r.situacao==='Paga'), venc=rs.filter(r=>r.situacao==='Vencida');
  const vp=sum(paga), vv=sum(venc), desc=sum(rs,r=>r.desconto);
  const prz=rs.filter(r=>r.prazo!=null); const pm=prz.length?sum(prz,r=>r.prazo)/prz.length:null;
  const K=[
    ['Ticket médio por cobrança', n?brl.format(tot/n):'—', int.format(n)+' cobranças'],
    ['Faturamento total', tot>=1e7?cmp(tot):brl.format(tot), tot>=1e7?brl.format(tot):''],
    ['Valor recebido (pagas)', vp>=1e7?cmp(vp):brl.format(vp), tot?'<span class="ok">'+pct(vp/tot)+'</span> do faturado':''],
    ['Valor vencido em aberto', vv>=1e7?cmp(vv):brl.format(vv), tot?'<span class="bad">'+pct(vv/tot)+'</span> de inadimplência':''],
    ['Desconto concedido', brl2.format(desc), rs.length?int.format(rs.filter(r=>r.desconto>0).length)+' cobranças com desconto':''],
    ['Prazo médio de recebimento', pm==null?'—':pm.toLocaleString('pt-BR',{maximumFractionDigits:1})+' dias', prz.length?'entre notificação e pagamento':'']
  ];
  document.getElementById('kpis').innerHTML=K.map(k=>'<div class="kpi"><div class="k">'+k[0]+'</div><div class="v">'+k[1]+'</div><div class="s">'+k[2]+'</div></div>').join('');

  // Situação
  const sit=[...groupSum(rs,'situacao')].sort((a,b)=>b[1]-a[1]);
  setBar(CH.sit,sit.map(x=>x[0]),sit.map(x=>x[1]),'situacao');
  const tp=[...groupSum(rs,'tipo')].sort((a,b)=>b[1]-a[1]);
  setBar(CH.tipo,tp.map(x=>x[0]),tp.map(x=>x[1]),'tipo');

  // Anual
  const an=[...groupSum(rs,'y')].sort((a,b)=>a[0]-b[0]);
  CH.ano.data.labels=an.map(x=>String(x[0]));
  CH.ano.data.datasets[0].data=an.map(x=>x[1]); CH.ano.data.datasets[1].data=an.map(x=>x[1]);
  CH.ano.update();

  // Mensal por ano
  const years=[...new Set(rs.map(r=>r.y))].sort();
  const pal=[css('--accent'),css('--text'),css('--muted'),css('--accent-lo'),css('--map-hi')];
  CH.mes.data.datasets=years.map((y,i)=>{const arr=new Array(12).fill(0); rs.forEach(r=>{if(r.y===y) arr[r.m]+=r.valor;});
    const c=pal[(years.length-1-i)%pal.length];
    return {label:String(y),data:arr.map(v=>v||null),borderColor:c,backgroundColor:c,pointBackgroundColor:c,borderWidth:2.5,pointRadius:3,tension:.3,spanGaps:false};});
  CH.mes.update();

  // Meio
  const mi=[...groupSum(rs,'meio')].sort((a,b)=>b[1]-a[1]);
  CH.meio.data.labels=mi.map(x=>x[0]); CH.meio.data.datasets[0].data=mi.map(x=>x[1]);
  const base=[css('--accent-hi'),css('--accent'),css('--accent-lo'),'#7a3412','#f6c9a3','#5c2a10'];
  CH.meio.data.datasets[0].backgroundColor=mi.map((x,i)=>F.meio.size&&!F.meio.has(x[0])?'#4a443f':base[i%base.length]);
  CH.meio.update();

  // Mapa: valores consideram todos os filtros exceto UF (para o estado selecionado continuar com contexto)
  const rsMap=all.filter(r=>pass(r,'uf')); UFV={}; UFN={};
  rsMap.forEach(r=>{UFV[r.uf]=(UFV[r.uf]||0)+r.valor; UFN[r.uf]=(UFN[r.uf]||0)+1;});
  const mx=Math.max(1,...Object.values(UFV));
  const b=hex(css('--map-base')), h=hex(css('--map-hi')), dim=hex('#3b4636');
  document.querySelectorAll('#map path.uf').forEach(p=>{
    const u=p.dataset.uf, v=UFV[u]||0;
    const selected=F.uf.has(u)||(!F.uf.size&&F.regiao.size&&F.regiao.has(UF2REG[u]));
    if(selected){p.style.fill=css('--map-sel');return;}
    if(!v){p.style.fill=rgb(dim);return;}
    const t=Math.sqrt(v/mx); p.style.fill=rgb(b.map((c,i)=>c+(h[i]-c)*t));
  });
  const selLbl=document.getElementById('selLbl'), selVal=document.getElementById('selVal');
  if(F.uf.size||F.regiao.size){
    const lbl=F.uf.size?[...F.uf].join(', '):[...F.regiao].join(', ');
    selLbl.textContent='Faturamento '+(F.uf.size?'UF ':'região ')+lbl; selVal.textContent=brl.format(tot);
  } else { const top=Object.entries(UFV).sort((a,b)=>b[1]-a[1])[0];
    selLbl.textContent=top?'Maior UF: '+top[0]+' · clique para filtrar':'Clique em um estado para filtrar'; selVal.textContent=top?brl.format(top[1]):''; }
  document.getElementById('foot').textContent='Atualizado em '+new Date().toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
}
function setBar(ch,labels,vals,key){
  ch.data.labels=labels; ch.data.datasets[0].data=vals;
  const ds=ch.data.datasets[0];
  if(F[key].size){ const orig=ds._bg||(ds._bg=ds.backgroundColor); ds.backgroundColor=c=>F[key].has(labels[c.dataIndex])?orig(c):'#4a443f'; }
  else if(ds._bg) ds.backgroundColor=ds._bg;
  ch.update();
}
const hex=s=>{s=s.replace('#','');return [0,2,4].map(i=>parseInt(s.slice(i,i+2),16));};
const rgb=a=>'rgb('+a.map(Math.round).join(',')+')';

function renderSlicers(all){
  const opts={
    ano:[...new Set(all.map(r=>r.y))].sort(),
    regiao:Object.keys(REGIOES).filter(r=>all.some(x=>x.regiao===r)).concat(all.some(x=>x.regiao==='Outros')?['Outros']:[]),
    situacao:[...new Set(all.map(r=>r.situacao))].sort((a,b)=>{const ia=SIT_ORDER.indexOf(a),ib=SIT_ORDER.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b);}),
    cliente:[...new Set(all.map(r=>r.cliente))].sort()
  };
  document.querySelectorAll('.slicer').forEach(el=>{
    const k=el.dataset.key, f=FIELD[k];
    const avail=new Set(all.filter(r=>pass(r,k)).map(r=>r[f]));
    el.querySelector('.opts').innerHTML=opts[k].map(v=>'<button type="button" class="'+(F[k].has(v)?'on ':'')+(avail.has(v)?'':'na')+'" data-v="'+esc(v)+'">'+esc(v)+'</button>').join('');
    el.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>toggle(k,k==='ano'?+b.dataset.v:b.dataset.v));
  });
}
function renderChips(){
  const el=document.getElementById('chips'); const parts=[];
  for(const k in F) for(const v of F[k]) parts.push('<button type="button" class="chip" data-k="'+k+'" data-v="'+esc(v)+'">'+FLABEL[k]+': '+esc(v)+' ✕</button>');
  el.innerHTML=parts.length?parts.join('')+'<button type="button" class="btn ghost" id="clearAll" style="padding:4px 10px;font-size:12px">Limpar filtros</button>':'Dica: clique nas barras, na rosca ou no mapa para filtrar o painel.';
  el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const k=b.dataset.k; F[k].delete(k==='ano'?+b.dataset.v:b.dataset.v); render();});
  const ca=document.getElementById('clearAll'); if(ca) ca.onclick=()=>{Object.values(F).forEach(s=>s.clear()); render();};
}

/* ---------- Upload / drag-and-drop ---------- */
const fileIn=document.getElementById('file');
document.getElementById('btnUp').onclick=()=>fileIn.click();
fileIn.onchange=()=>{ if(fileIn.files[0]) loadFile(fileIn.files[0]); fileIn.value=''; };
const drop=document.getElementById('drop'); let dc=0;
addEventListener('dragenter',e=>{if([...e.dataTransfer.types].includes('Files')){dc++;drop.hidden=false;}});
addEventListener('dragleave',()=>{if(--dc<=0){dc=0;drop.hidden=true;}});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dc=0;drop.hidden=true;const f=e.dataTransfer.files[0]; if(f) loadFile(f);});

loadDefault();
</script>
